<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3c5e3d" />
    <meta name="google-site-verification" content="CatLyqnZfC1XjSeXSqXtJEkZkNR7WeWYAfXqJhPI0sU" />
    <meta
      name="description"
      content="FonPack, indústria de embalagens sob medida: caixas, fitas, bobinas e acessórios. Peça seu orçamento pelo WhatsApp."
    />
    <link rel="canonical" href="https://fonpackembalagens.com.br/" />
    <title>FonPack Embalagens | Indústria de Embalagens sob medida</title>

    <!--
      Dados estruturados (Organization/LocalBusiness) ficam aqui, estáticos no
      HTML, porque este é um app 100% client-side (SPA): tudo que o React
      injeta via react-helmet-async só existe depois do JS rodar. Robôs que
      não executam JS (e o Google na primeira passada de rastreio) só veem o
      que está neste arquivo — por isso o essencial da marca mora aqui.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "FonPack Embalagens",
        "alternateName": ["FonPack", "FonPack Indústria de Embalagens", "FonPack Indústria"],
        "image": "https://fonpackembalagens.com.br/produtos/corte-vinco/0.webp",
        "url": "https://fonpackembalagens.com.br/",
        "telephone": "+5511942508424",
        "email": "fonpack@hotmail.com",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "R. Sesefredo Klein Doll, 900",
          "addressLocality": "Embu-Guaçu",
          "addressRegion": "SP",
          "postalCode": "06933-080",
          "addressCountry": "BR"
        },
        "description": "FonPack, indústria de embalagens sob medida: caixas, fitas, bobinas e acessórios. Peça seu orçamento pelo WhatsApp."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
